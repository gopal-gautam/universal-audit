[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-audit"
version = "0.1.0"
description = "Run dependency vulnerability audits across multiple package ecosystems from one CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Universal Audit contributors" }]
keywords = ["audit", "security", "vulnerability", "dependencies", "sca"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/gopal-gautam/universal-audit"
Repository = "https://github.com/gopal-gautam/universal-audit"
Issues = "https://github.com/gopal-gautam/universal-audit/issues"
Changelog = "https://github.com/gopal-gautam/universal-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
universal-audit = "universal_audit.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["universal_audit*"]
